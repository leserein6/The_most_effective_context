# HISTORICAL V0.2 REFERENCE ONLY. Do not create current instances from this template.
# Current schema: ../schema/project.md; runtime uses Markdown project.md and companion documents.
# V0 Project 实例模板；正式实例位于仓库根 projects/<id>/project.yaml
# 创建前必须展示草案并获得明确确认。
# 字段含义以 project-management/schema/ 中的契约为准。
schema_version: "0.1"
id: null
name: null

intent:
  problem: null
  desired_outcome: null
  success_signals: null # 未知用 null；确认后的具体信号使用列表

scope:
  in: null               # 未界定不等于确认没有
  out: null

deliverables: null
constraints: null

state:
  phase: active           # 只用于经用户确认创建后的正式 Project
  summary: "项目定义已确认；尚无经过验证的实施成果"
  verified_outputs: []
  next_action: null       # 若已决定：{description: "...", status: confirmed}
                          # 仅建议时：{description: "...", status: proposed}
  blockers: []
  updated_at: null        # 成功写入时填可靠 ISO 8601 时间；不可编造

references:
  decisions: null         # 只有指向真实文件时才填写
  journal: null           # 可选，不存储单轮 Task
  evidence: []
