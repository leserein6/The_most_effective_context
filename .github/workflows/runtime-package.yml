name: Build minimal Harness runtime

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - codex/project-workspace-v1-20261117
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate maintained Markdown structure
        run: python3 scripts/check_docs.py
      - name: Build and verify whitelist distribution
        run: |
          python3 scripts/build_runtime.py --output dist/harness-runtime.zip
          python3 scripts/build_runtime.py --output dist/harness-runtime.zip --verify
      - name: Smoke test installing only the downloaded archive
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import tempfile
          import zipfile

          archive = pathlib.Path('dist/harness-runtime.zip').resolve()
          with tempfile.TemporaryDirectory() as d:
              tmp = pathlib.Path(d)
              package = tmp / 'package'
              package.mkdir()
              with zipfile.ZipFile(archive) as z:
                  z.extractall(package)
              assert not (package / 'docs').exists()
              assert not (package / 'tests').exists()
              assert not (package / 'README.md').exists()
              assert not (package / 'project-management/projects').exists()
              for mode in ('workspace', 'project'):
                  target = tmp / ('target-' + mode)
                  if mode == 'project':
                      target.mkdir()
                      (target / 'README.md').write_text('Business documentation\n')
                      (target / '.gitignore').write_text('business-ignore\n')
                  command = [sys.executable, str(package / 'scripts/install.py'),
                             '--target', str(target), '--mode', mode]
                  subprocess.run(command + ['--apply'], check=True)
                  pm_root = target if mode == 'workspace' else target / '.codebuddy/harness'
                  subprocess.run([sys.executable, str(pm_root / 'scripts/pm.py'), 'doctor'], check=True)
                  # Discover only enabled method summaries from the installed package.
                  extensions = [sys.executable, str(pm_root / 'scripts/extensions.py')]
                  def discover():
                      return json.loads(subprocess.check_output(extensions + ['list', '--task', 'proposal']))
                  summary = next(item for item in discover() if item['id'] == 'panorama')
                  assert (pm_root / summary['entry']).is_file()
                  assert (pm_root / 'extensions/panorama/maps/microservice.md').is_file()
                  project_index = pm_root / 'project-management/Index.md'
                  index_before = project_index.read_bytes()
                  subprocess.run(extensions + ['disable', 'panorama'], check=True)
                  assert 'panorama' not in {item['id'] for item in discover()}
                  subprocess.run(extensions + ['enable', 'panorama'], check=True)
                  assert summary in discover() and project_index.read_bytes() == index_before
                  assert not (pm_root / 'docs').exists()
                  assert not (pm_root / 'tests').exists()
                  # Optional Skills ship inside the archive but must NOT appear in default workspaces.
                  selected_skill = target / '.codebuddy/skills/work-report/SKILL.md'
                  unselected_skill = target / '.codebuddy/skills/work-meeting/SKILL.md'
                  assert not selected_skill.exists()
                  assert not unselected_skill.exists()
                  subprocess.run(command + ['--skills-only', '--skill', 'work-report', '--apply'], check=True)
                  assert selected_skill.is_file()
                  assert not unselected_skill.exists()
                  # Installing the same selection twice must not modify the core.
                  subprocess.run(command + ['--skills-only', '--skill', 'work-report', '--apply'], check=True)
                  subprocess.run([sys.executable, str(pm_root / 'scripts/pm.py'), 'doctor'], check=True)
                  if mode == 'project':
                      assert (target / 'README.md').read_text() == 'Business documentation\n'
                      assert (target / '.gitignore').read_text() == 'business-ignore\n'
          PY
      - name: Verify Work Item lifecycle and legacy Project compatibility
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import tempfile
          import zipfile

          archive = pathlib.Path('dist/harness-runtime.zip').resolve()
          with tempfile.TemporaryDirectory() as d:
              tmp = pathlib.Path(d)
              package = tmp / 'package'
              package.mkdir()
              with zipfile.ZipFile(archive) as z:
                  z.extractall(package)
              root = tmp / 'workspace'
              subprocess.run([sys.executable, str(package / 'scripts/install.py'),
                              '--target', str(root), '--mode', 'workspace', '--apply'], check=True)
              pm = [sys.executable, str(root / 'scripts/pm.py')]

              def call(*args, success=True):
                  result = subprocess.run(pm + list(args), capture_output=True, text=True)
                  if success:
                      assert result.returncode == 0, (args, result.stderr)
                      return json.loads(result.stdout)
                  assert result.returncode != 0, ('unexpected success', args)
                  return result.stderr

              def checkpoint(turn, token, success=True, **extra):
                  payload = {'turn_id': turn, 'mode': 'plan', 'progress': '工作项验收测试',
                             'next': '按依赖执行', 'operations': ['核对工作项事实'],
                             'evidence': [], 'outcome': '已记录'}
                  payload.update(extra)
                  path = tmp / (turn + '.json')
                  path.write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
                  return call('checkpoint', 'legacy', '--expected', token, '--payload', str(path),
                              success=success)

              call('create', '--id', 'legacy', '--name', '旧项目', '--type',
                   'development', '--summary', '追踪业务需求', '--confirmed')
              baseline = call('resume', 'legacy')
              assert baseline['work_items']['tracked'] is False
              work_path = root / 'project-management/projects/active/development/legacy/work-items.md'
              assert not work_path.exists()
              token = baseline['token']

              new_items = [
                  {'op': 'create', 'id': 'WI-01', 'title': '确定接口',
                   'acceptance': ['接口约定已经核验']},
                  {'op': 'create', 'id': 'WI-02', 'title': '实现依赖接口的行为',
                   'depends_on': ['WI-01'], 'acceptance': ['回归测试通过']},
              ]
              result = checkpoint('turn-01', token, work_item_ids=['WI-01'],
                                  work_item_updates=new_items)
              token = result['token']
              assert work_path.is_file()
              assert call('resume', 'legacy')['work_items']['counts']['pending'] == 2
              assert call('work-items', 'legacy')['tracked'] is True
              assert 'WI-01' in work_path.read_text(encoding='utf-8')

              bad = checkpoint('bad-dependency', token, success=False,
                               work_item_updates=[{'op': 'update', 'id': 'WI-02',
                                                   'status': 'in_progress'}])
              assert 'Unfinished dependency' in bad
              assert call('resume', 'legacy')['token'] == token

              bad = checkpoint('bad-evidence', token, success=False,
                               work_item_updates=[{'op': 'update', 'id': 'WI-01',
                                                   'status': 'completed'}])
              assert 'observed evidence' in bad
              assert call('resume', 'legacy')['token'] == token

              bad = checkpoint('bad-cycle', token, success=False,
                               work_item_updates=[
                                  {'op': 'create', 'id': 'WI-03', 'title': '甲',
                                   'acceptance': ['结果可见'], 'depends_on': ['WI-04']},
                                  {'op': 'create', 'id': 'WI-04', 'title': '乙',
                                   'acceptance': ['结果可见'], 'depends_on': ['WI-03']},
                               ])
              assert 'cycle' in bad
              assert 'WI-03' not in work_path.read_text(encoding='utf-8')
              assert call('resume', 'legacy')['token'] == token

              proof = [{'kind': 'observed', 'claim': '本次验收已执行', 'source': 'checks/acceptance.log'}]
              result = checkpoint('turn-02', token,
                                  work_item_updates=[{'op': 'update', 'id': 'WI-01',
                                                      'status': 'completed', 'evidence': proof}])
              token = result['token']
              assert call('resume', 'legacy')['work_items']['counts']['completed'] == 1
              result = checkpoint('turn-03', token,
                                  work_item_updates=[{'op': 'update', 'id': 'WI-02',
                                                      'status': 'blocked', 'blocker': '等待接口确认',
                                                      'next_action': '确认接口'}])
              token = result['token']
              assert call('resume', 'legacy')['work_items']['counts']['blocked'] == 1
              result = checkpoint('turn-04', token,
                                  work_item_updates=[{'op': 'update', 'id': 'WI-02',
                                                      'status': 'in_progress',
                                                      'next_action': '实现与验证'}])
              token = result['token']
              assert call('resume', 'legacy')['work_items']['counts']['in_progress'] == 1
              result = checkpoint('turn-05', token,
                                  work_item_updates=[{'op': 'update', 'id': 'WI-02',
                                                      'status': 'completed', 'evidence': proof}])
              token = result['token']
              state = call('resume', 'legacy')
              assert state['work_items']['counts']['completed'] == 2
              assert state['work_items']['counts']['blocked'] == 0

              bad = checkpoint('bad-id', token, success=False, work_item_ids=['WI-99'])
              assert 'unknown Work Item' in bad
              assert call('resume', 'legacy')['token'] == token
              assert call('doctor')['ok'] is True

              call('status', 'legacy', '--expected', token, '--status', 'archived',
                   '--reason', '用户要求暂停', '--confirmed')
              assert call('doctor')['ok'] is True
              assert call('resume', 'legacy')['work_items']['counts']['completed'] == 2
          PY
      - name: Verify safe runtime cleanup and stdin writes
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          import time
          import zipfile

          archive = pathlib.Path('dist/harness-runtime.zip').resolve()
          with tempfile.TemporaryDirectory() as td:
              base = pathlib.Path(td)
              package = base / 'package'
              package.mkdir()
              with zipfile.ZipFile(archive) as z:
                  z.extractall(package)
              workspace = base / 'workspace'
              installer = [sys.executable, str(package / 'scripts/install.py')]
              subprocess.run(installer + ['--target', str(workspace), '--mode', 'workspace', '--apply'], check=True)
              pm = [sys.executable, str(workspace / 'scripts/pm.py')]

              def call(*args, input_text=None, success=True):
                  proc = subprocess.run(pm + list(args), cwd=workspace, input=input_text,
                                        text=True, capture_output=True)
                  if success:
                      assert proc.returncode == 0, (args, proc.stdout, proc.stderr)
                      return json.loads(proc.stdout)
                  assert proc.returncode != 0, ('unexpected success', args)
                  return proc.stderr

              call('create', '--id', 'cleanup-probe', '--name', '隔离测试', '--type', 'development',
                   '--summary', '验证清理安全边界', '--confirmed')
              token = call('resume', 'cleanup-probe')['token']
              payload = {'project_id': 'cleanup-probe', 'turn_id': 'turn-clean-001', 'mode': 'plan', 'progress': '已完成测试输入',
                         'next': '运行清理验证', 'operations': ['执行一次真实 checkpoint'],
                         'evidence': [], 'outcome': '已写入'}
              # Preferred path: stdin, no turn JSON is created at all.
              call('checkpoint', 'cleanup-probe', '--expected', token, '--payload', '-',
                   input_text=json.dumps(payload, ensure_ascii=False))
              assert call('doctor')['ok']
              rt = workspace / '.pm-runtime'
              assert not list(rt.glob('turn-*.json'))

              # Legacy JSON is eligible ONLY when its turn has already been persisted.
              old_input = rt / 'turn-20261119-001.json'
              old_input.write_text(json.dumps(payload), encoding='utf-8')
              stale = time.time() - 3 * 86400
              os.utime(old_input, (stale, stale))
              failed_input = rt / 'turn-20261119-002.json'
              failed_input.write_text(json.dumps(dict(payload, turn_id='never-committed')), encoding='utf-8')
              os.utime(failed_input, (stale, stale))
              notes = rt / 'definition.md'
              notes.write_text('not a checkpoint payload', encoding='utf-8')
              folder = rt / 'ai-spring-2027'
              folder.mkdir()
              (folder / 'important.md').write_text('keep me', encoding='utf-8')
              outside = base / 'outside.txt'
              outside.write_text('must remain', encoding='utf-8')
              (rt / 'outside-link').symlink_to(outside)

              preview = call('clean')
              assert preview['dry_run'] is True and not preview['removed']
              assert [x['path'] for x in preview['eligible']] == [old_input.name], preview
              assert old_input.exists()
              applied = call('clean', '--apply')
              assert applied['removed'] == [old_input.name], applied
              assert not old_input.exists()
              assert failed_input.exists() and notes.exists()
              assert (folder / 'important.md').read_text() == 'keep me'
              assert outside.read_text() == 'must remain'
              assert (rt / 'outside-link').is_symlink()
              assert call('clean', '--apply')['removed'] == []
              assert (rt / 'lock').exists()

              # Failed writes cannot mark input as persisted or consume caller files.
              token = call('resume', 'cleanup-probe')['token']
              bad = rt / 'turn-20261119-003.json'
              bad.write_text(json.dumps(dict(payload, turn_id='never-committed', mode='invalid')),
                             encoding='utf-8')
              call('checkpoint', 'cleanup-probe', '--expected', token,
                   '--payload', str(bad), success=False)
              assert bad.is_file()
              assert call('doctor')['ok']

              # An interrupted transaction prevents clean until recovery.
              pending = rt / 'pending.json'
              pending.write_text('{"before": {}}', encoding='utf-8')
              call('clean', success=False)
              assert pending.exists()
              assert call('recover', '--rollback')['rolled_back'] is True
              assert not pending.exists()
              assert call('doctor')['ok']
          PY
      - name: Verify Project-scoped cleanup and large status migration
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          import time
          import zipfile
          from unittest import mock

          archive = pathlib.Path('dist/harness-runtime.zip').resolve()
          with tempfile.TemporaryDirectory() as td:
              root = pathlib.Path(td)
              package = root / 'package'
              package.mkdir()
              with zipfile.ZipFile(archive) as z:
                  z.extractall(package)
              workspace = root / 'workspace'
              subprocess.run([sys.executable, str(package / 'scripts/install.py'),
                              '--target', str(workspace), '--mode', 'workspace', '--apply'], check=True)
              exe = [sys.executable, str(workspace / 'scripts/pm.py')]
              def call(*args, input_text=None, succeed=True):
                  p = subprocess.run(exe + list(args), input=input_text,
                                     text=True, capture_output=True, cwd=workspace)
                  assert (p.returncode == 0) == succeed, (args, p.stdout, p.stderr)
                  return json.loads(p.stdout) if succeed else p.stderr
              def create(pid):
                  call('create', '--id', pid, '--name', pid, '--type', 'development',
                       '--summary', 'safe isolation', '--confirmed')
              def checkpoint(pid, data):
                  token = call('resume', pid)['token']
                  call('checkpoint', pid, '--expected', token, '--payload', '-',
                       input_text=json.dumps(data, ensure_ascii=False))
              def payload(pid, tid):
                  return {'project_id': pid, 'turn_id': tid, 'mode': 'plan',
                          'progress': 'progress', 'next': 'next', 'operations': ['check'],
                          'evidence': [], 'outcome': 'complete'}
              def old_file(name, data):
                  path = workspace / '.pm-runtime' / name
                  path.write_text(json.dumps(data, ensure_ascii=False), encoding='utf-8')
                  stamp = time.time() - 72 * 3600
                  os.utime(path, (stamp, stamp))
                  return path

              create('alpha')
              create('beta')
              a = payload('alpha', 'same-turn')
              b = payload('beta', 'same-turn')
              checkpoint('alpha', a)
              checkpoint('beta', b)
              checkpoint('alpha', payload('alpha', 'alpha-only'))
              valid = old_file('turn-alpha.json', a)
              changed = old_file('turn-beta-changed.json', dict(b, outcome='uncommitted edit'))
              uncommitted = old_file('turn-forged.json', payload('beta', 'alpha-only'))
              legacy = old_file('turn-legacy.json', {k: v for k, v in a.items() if k != 'project_id'})
              preview = call('clean')
              assert [v['path'] for v in preview['eligible']] == [valid.name], preview
              applied = call('clean', '--apply')
              assert applied['removed'] == [valid.name], applied
              assert not valid.exists()
              assert changed.exists() and uncommitted.exists() and legacy.exists()
              old_file('turn-alpha.json', a)
              recent = old_file('turn-recent.json', b)
              os.utime(recent, None)
              assert call('doctor')['ok'] and valid.exists()
              call('checkpoint', 'alpha', '--expected', 'outdated', '--payload', '-',
                   input_text=json.dumps(payload('alpha', 'later')), succeed=False)
              assert valid.exists()
              current = old_file('turn-current.json', payload('beta', 'current'))
              call('checkpoint', 'beta', '--expected', call('resume', 'beta')['token'],
                   '--payload', str(current))
              assert not valid.exists() and current.exists() and recent.exists()
              assert changed.exists() and uncommitted.exists() and legacy.exists()
              # A later edit also triggers housekeeping; protect its own named input.
              call('edit', 'beta', '--expected', call('resume', 'beta')['token'],
                   '--document', 'notes.md', '--file', str(current), '--reason', 'input retained')
              assert current.exists()
              checkpoint('alpha', payload('alpha', 'later'))
              assert not current.exists() and recent.exists()
              assert 'Duplicate turn_id' in call('checkpoint', 'alpha', '--expected',
                    call('resume', 'alpha')['token'], '--payload', '-',
                    input_text=json.dumps(a), succeed=False)
              assert call('doctor')['ok']
              big = workspace / 'project-management/projects/active/development/alpha/work/data.bin'
              big.write_bytes(b'z' * (3 * 1024 * 1024))
              token = call('resume', 'alpha')['token']
              spec = importlib.util.spec_from_file_location('pm_under_test', workspace / 'scripts/pm.py')
              pm = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(pm)
              # Maintenance I/O failures must not discard a valid checkpoint.
              new_turn = payload('alpha', 'cleanup-io-failure')
              args_write = pm.parser().parse_args(['--root', str(workspace), 'checkpoint', 'alpha',
                  '--expected', token, '--payload', '-'])
              with mock.patch.object(pm, 'clean_runtime', side_effect=OSError('fixture: cleanup unavailable')), \
                   mock.patch.object(pm, 'read_payload', return_value=new_turn):
                  token = pm.run(args_write)['token']
              assert 'cleanup-io-failure' in pm.receipt_records(
                  workspace / 'project-management/projects/active/development/alpha/logs/receipts.md')
              args = pm.parser().parse_args(['--root', str(workspace), 'status', 'alpha',
                  '--expected', token, '--status', 'archived', '--reason', 'confirmed in test', '--confirmed'])
              with mock.patch.object(pm.shutil, 'disk_usage') as mocked:
                  mocked.return_value = type('Usage', (), {'free': 1})()
                  try:
                      pm.run(args)
                      raise AssertionError('Expected insufficient-space rejection')
                  except ValueError as exc:
                      assert 'Insufficient free space' in str(exc), exc
              assert big.is_file()
              assert not (workspace / '.pm-runtime/pending.json').exists()
              call('status', 'alpha', '--expected', token, '--status', 'archived',
                   '--reason', 'confirmed in test', '--confirmed')
              archived = workspace / 'project-management/projects/archived/development/alpha/work/data.bin'
              assert archived.read_bytes() == b'z' * (3 * 1024 * 1024)
              assert not big.exists()
              assert call('doctor')['ok']
              assert not (workspace / '.pm-runtime/pending.json').exists()

              # Inject a mid-migration write error: the original Project must be restored.
              token2 = call('resume', 'alpha')['token']
              args2 = pm.parser().parse_args(['--root', str(workspace), 'status', 'alpha',
                  '--expected', token2, '--status', 'completed',
                  '--reason', 'injected failure', '--confirmed'])
              actual_atomic = pm.atomic
              hit = {'value': False}
              def inject_once(path, data, mode=None):
                  if (not hit['value'] and '/completed/' in str(path)
                          and str(path).endswith('/state.md')):
                      hit['value'] = True
                      raise OSError('injected mid-migration failure')
                  return actual_atomic(path, data, mode=mode)
              with mock.patch.object(pm, 'atomic', side_effect=inject_once):
                  try:
                      pm.run(args2)
                      raise AssertionError('Expected injected migration failure')
                  except OSError as exc:
                      assert 'injected mid-migration' in str(exc), exc
              assert hit['value']
              assert archived.read_bytes() == b'z' * (3 * 1024 * 1024)
              assert not (workspace / '.pm-runtime/pending.json').exists()
              assert call('doctor')['ok']

              # Advisory capacity warning is read-only; never auto-prune unknown files.
              unknown = workspace / '.pm-runtime' / 'unrecognized-large.bin'
              unknown.write_bytes(b'a' * (11 * 1024 * 1024))
              diagnostics = call('doctor')
              assert diagnostics['ok'] and diagnostics['runtime_bytes'] >= 11 * 1024 * 1024
              assert diagnostics['warnings']
              assert not call('clean', '--apply')['removed']
              assert unknown.exists() and unknown.stat().st_size == 11 * 1024 * 1024
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: harness-runtime
          path: |
            dist/harness-runtime.zip
            dist/harness-runtime.zip.sha256
          if-no-files-found: error
